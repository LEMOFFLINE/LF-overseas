[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/products.html"
  to = "/products"
  status = 301
  force = true

[[redirects]]
  from = "/business-professional-wear.html"
  to = "/business-professional-wear"
  status = 301
  force = true

[[redirects]]
  from = "/corporate-logo-apparel.html"
  to = "/corporate-logo-apparel"
  status = 301
  force = true

[[redirects]]
  from = "/industrial-workwear.html"
  to = "/industrial-workwear"
  status = 301
  force = true

[[redirects]]
  from = "/team-jackets-hoodies.html"
  to = "/team-jackets-hoodies"
  status = 301
  force = true

[[redirects]]
  from = "/outdoor-apparel.html"
  to = "/outdoor-apparel"
  status = 301
  force = true

[[redirects]]
  from = "/school-uniforms.html"
  to = "/school-uniforms"
  status = 301
  force = true

[[redirects]]
  from = "/manufacturing.html"
  to = "/manufacturing"
  status = 301
  force = true

[[redirects]]
  from = "/quality"
  to = "/manufacturing"
  status = 301
  force = true

[[redirects]]
  from = "/quality.html"
  to = "/manufacturing"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
